<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- meta = وسم معلومات لا يظهر للمستخدم -->
    <!-- charset = نوع الحروف المستخدمة -->
    <!-- UTF-8 = يدعم كل حروف العالم -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- viewport = يتحدث عن حجم الشاشة -->
    <!-- width=device-width = عرض الصفحة يساوي عرض الشاشة -->
    <!-- initial-scale=1.0 = اعرض بالحجم الطبيعي -->

    <title>PX8 - Abs</title>
    <!-- title = اسم الصفحة في تبويب المتصفح -->

    <link rel="stylesheet" href="../css/style.css">
    <!-- link = ربط ملف التصميم -->
    <!-- href = ارجع خطوة للخلف ثم اذهب إلى مجلد css -->

</head>

<body>

    <header>
        <a href="../index.html">← Home</a>
        <!-- a = رابط للرجوع للصفحة الرئيسية -->

        <h1>Abs</h1>
        <!-- h1 = اسم العضلة -->
    </header>

    <main>

        <section class="exercises-list">

            <h2>Exercises</h2>

            <div class="exercise-item">
                <button class="exercise-toggle">Crunches ▼</button>
                <div class="exercise-details">
                    <div class="set-form">
                        <input type="number" placeholder="Weight (kg)">
                        <input type="number" placeholder="Reps">
                        <select>
                            <option>✅ Success</option>
                            <option>❌ Failed</option>
                        </select>
                        <button class="add-set">+ Add Set</button>
                    </div>
                </div>
            </div>

            <div class="exercise-item">
                <button class="exercise-toggle">Plank ▼</button>
                <div class="exercise-details">
                    <div class="set-form">
                        <input type="number" placeholder="Weight (kg)">
                        <input type="number" placeholder="Reps">
                        <select>
                            <option>✅ Success</option>
                            <option>❌ Failed</option>
                        </select>
                        <button class="add-set">+ Add Set</button>
                    </div>
                </div>
            </div>

            <div class="exercise-item">
                <button class="exercise-toggle">Leg Raises ▼</button>
                <div class="exercise-details">
                    <div class="set-form">
                        <input type="number" placeholder="Weight (kg)">
                        <input type="number" placeholder="Reps">
                        <select>
                            <option>✅ Success</option>
                            <option>❌ Failed</option>
                        </select>
                        <button class="add-set">+ Add Set</button>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <footer>
    </footer>

    <script src="../js/main.js"></script>

</body>

</html>
