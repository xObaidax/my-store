<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- meta = وسم معلومات لا يظهر للمستخدم -->
    <!-- charset = نوع الحروف المستخدمة -->
    <!-- UTF-8 = يدعم كل حروف العالم -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- meta = معلومات للمتصفح لا تظهر للمستخدم -->
    <!-- name = اسم نوع المعلومة -->
    <!-- viewport = الشاشة التي يرى منها المستخدم الموقع -->
    <!-- content = محتوى التعليمة -->
    <!-- width=device-width = اجعل عرض الصفحة يساوي عرض الشاشة -->
    <!-- initial-scale=1.0 = اعرض بالحجم الطبيعي بدون تكبير أو تصغير -->

    <title>PX8 - Back</title>
    <!-- title = اسم صفحة عضلة الظهر في تبويب المتصفح -->

    <link rel="stylesheet" href="../css/style.css">
    <!-- link = ربط ملف التصميم -->
    <!-- href = ارجع خطوة للخلف ثم اذهب إلى مجلد css -->

</head>

<body>

    <header>
    <!-- header = الشريط العلوي للصفحة -->

        <a href="../index.html">← Home</a>
        <!-- a = رابط للتنقل بين الصفحات -->
        <!-- href="../index.html" = ارجع للصفحة الرئيسية -->
        <!-- ← Back = نص الرابط الذي سيظهر للمستخدم -->

        <h1>Back</h1>
        <!-- h1 = اسم العضلة -->

    </header>

    <main>

    <section class="exercises-list">
    <!-- exercises-list = قسم قائمة التمارين -->

        <h2>Exercises</h2>
        <!-- h2 = عنوان القسم -->

        <div class="exercise-item">
        <!-- exercise-item = صندوق تمرين واحد -->

            <button class="exercise-toggle">
            <!-- button = زر للطي والفتح -->
            <!-- exercise-toggle = كلاس الزر -->
                Pull Ups ▼
            </button>

            <div class="exercise-details">
            <!-- exercise-details = تفاصيل التمرين -->

                <div class="set-form">
                <!-- set-form = نموذج تسجيل جولة -->

                    <input type="number" placeholder="Weight (kg)">
                    <!-- input = حقل إدخال الوزن -->

                    <input type="number" placeholder="Reps">
                    <!-- input = حقل إدخال التكرارات -->

                    <select>
                    <!-- select = قائمة منسدلة -->
                        <option>✅ Success</option>
                        <option>❌ Failed</option>
                    </select>

                    <button class="add-set">+ Add Set</button>
                    <!-- button = زر إضافة جولة -->

                </div>
            </div>
        </div>

    </section>

</main>
<script src="../js/main.js"></script>
</body>

</html>
